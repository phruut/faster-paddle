[package]
name = "faster_paddle"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Fast CPU OCR (PaddleOCR PP-OCRv6 tiny/small/medium) with Python bindings, powered by ONNX Runtime."
repository = "https://github.com/phruut/faster-paddle"
# Models are optional at build time. The default wheel bundles nothing
# (code-only); sizes load from `model_dir`, the local cache, or a one-time
# download from the GitHub release. Build with `--features bundled-tiny`,
# `bundled-small`, `bundled-medium`, or `bundled-all` for self-contained wheels.
include = ["/src/**/*", "/models/**/*", "/build.rs", "/README.md", "/PERFORMANCE_CHANGES.md", "/PERFORMANCE_REVIEW.md", "/PERFORMANCE_NEXT.md", "/benchmarks/**/*.py", "/benchmarks/results/*.jsonl", "/benchmarks/results/*.log", "/pyproject.toml", "/LICENSE"]

[lib]
name = "faster_paddle"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bundled-tiny = []
bundled-small = []
bundled-medium = []
bundled-all = ["bundled-tiny", "bundled-small", "bundled-medium"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
# default features minus `tls-native` (which pulls openssl-sys and breaks
# dependency-free cross-platform wheel builds); use rustls for the model
# downloader instead.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-27",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "tiff", "gif"] }
imageproc = { version = "0.25", default-features = false }
rayon = "1"
num_cpus = "1.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# runtime download of sizes that aren't bundled; rustls to stay openssl-free
ureq = { version = "2", default-features = false, features = ["tls"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
