name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Serialize runs that share a ref so duplicate tag pushes don't race the
# model-asset upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: python -m pip install maturin pytest pillow
      # Self-contained test wheel: bundles every size so the suite stays
      # offline and never depends on release assets. The platform jobs below
      # cover the code-only + model_dir path; `download-check` covers downloads.
      - run: maturin build --release --locked --features bundled-all --out dist-test
      - run: python -m pip install dist-test/*.whl
      - run: python -m pytest tests -q

  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 honestly needs glibc 2.34 (ONNX Runtime's pthread@GLIBC_2.34).
        # aarch64 builds NATIVELY on an arm64 runner (cross-compilation silently
        # failed to static-link libstdc++); its ONNX Runtime tops out at glibc
        # 2.28, so it's tagged manylinux_2_28.
        include:
          - target: x86_64
            runner: ubuntu-latest
            manylinux: "2_34"
          - target: aarch64
            runner: ubuntu-24.04-arm
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
          manylinux: ${{ matrix.manylinux }}
          # Tell ort-sys to skip its dynamic libstdc++ link; build.rs links the
          # C++ runtime statically instead, so the wheel doesn't depend on the
          # host's libstdc++.so.6 version (manylinux GCC 11 references
          # GLIBCXX_3.4.29 symbols missing on older systems).
          before-script-linux: export ORT_CXX_STDLIB=
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14      # apple silicon
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # The default wheel bundles no model weights; every size ships as a GitHub
  # Release asset and the library downloads it on demand on first use
  # (see model_bytes in src/lib.rs). Asset names must match the runtime URL.
  model-assets:
    name: Upload model weights to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage assets (names must match the runtime download URL)
        run: |
          cp models/tiny/det.onnx ppocrv6_tiny_det.onnx
          cp models/tiny/rec.onnx ppocrv6_tiny_rec.onnx
          cp models/small/det.onnx ppocrv6_small_det.onnx
          cp models/small/rec.onnx ppocrv6_small_rec.onnx
          cp models/medium/det.onnx ppocrv6_medium_det.onnx
          cp models/medium/rec.onnx ppocrv6_medium_rec.onnx
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ppocrv6_tiny_det.onnx
            ppocrv6_tiny_rec.onnx
            ppocrv6_small_det.onnx
            ppocrv6_small_rec.onnx
            ppocrv6_medium_det.onnx
            ppocrv6_medium_rec.onnx

  # Tag-only: proves the uploaded assets are fetchable under the exact names
  # the runtime downloads (guards against misnamed/missing assets). Runs after
  # both the wheel build and the asset upload, with no local weights present.
  download-check:
    name: Check on-demand model download
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, model-assets]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install dist/*.whl
      - name: Construct an engine with no local weights (forces download)
        shell: bash
        env:
          OCR_THREADS: "2"
        run: |
          python -c "
          from faster_paddle import OcrEngine
          eng = OcrEngine(model_size='tiny', threads=2)
          cfg = eng.config
          assert (cfg['det_source'], cfg['rec_source']) == ('downloaded', 'downloaded'), cfg
          print('download OK:', cfg['det_model_size'], cfg['det_source'], cfg['rec_source'])
          "
