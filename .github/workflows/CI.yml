name: CI

# Branch pushes are a cheap smoke gate: only `tests` and `version-check` run.
# The full wheel matrix is gated on PRs, manual dispatch, and tag pushes (see
# the `if` on the platform jobs). Path filters are not evaluated for tag
# pushes, so releases always build everything; docs-only pushes run nothing.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".research/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".research/**"
  workflow_dispatch:

# Serialize runs that share a ref so duplicate tag pushes don't race the
# release upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# OpenVINO build/test pin. The Rust bindings accept any recent 2026.x, but
# the shipped IR weights and the wheel DLLs must come from ONE version, so
# every OV job and the IR conversion below use exactly this.
env:
  OV_VERSION: "2026.4.1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: python -m pip install maturin pytest pillow numpy
      # Self-contained test wheel: bundles every size so the suite stays
      # offline and never depends on release assets. The platform jobs below
      # cover the code-only + model_dir path; `download-check` covers downloads.
      # pyo3/extension-module: passed explicitly because maturin ignores
      # pyproject's feature list whenever the CLI passes --features.
      - run: maturin build --release --locked --features bundled-all,pyo3/extension-module --out dist-test
      - run: python -m pip install dist-test/*.whl
      - run: python -m pytest tests -q

  # Keeps Cargo.toml and pyproject.toml in sync on PRs, and on tags checks the
  # tag matches the manifest version: the release job attaches wheels under that
  # version tag, so a mismatched tag would publish mislabeled wheels. Model
  # weights live in their own pinned release (see MODELS_TAG in src/lib.rs).
  version-check:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Cargo.toml, pyproject.toml and (on tags) the git tag
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          pyproject_version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "cargo=$cargo_version pyproject=$pyproject_version ref=$GITHUB_REF"
          if [ "$cargo_version" != "$pyproject_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and pyproject.toml ($pyproject_version) disagree"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag_version=${GITHUB_REF_NAME#v}
              if [ "$tag_version" != "$cargo_version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match manifest version $cargo_version"
                exit 1
              fi
              ;;
          esac

  linux:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 honestly needs glibc 2.34 (ONNX Runtime's pthread@GLIBC_2.34).
        # aarch64 builds NATIVELY on an arm64 runner (cross-compilation silently
        # failed to static-link libstdc++); its ONNX Runtime tops out at glibc
        # 2.28, so it's tagged manylinux_2_28.
        include:
          - target: x86_64
            runner: ubuntu-latest
            manylinux: "2_34"
          - target: aarch64
            runner: ubuntu-24.04-arm
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
          manylinux: ${{ matrix.manylinux }}
          # Tell ort-sys to skip its dynamic libstdc++ link; build.rs links the
          # C++ runtime statically instead, so the wheel doesn't depend on the
          # host's libstdc++.so.6 version (manylinux GCC 11 references
          # GLIBCXX_3.4.29 symbols missing on older systems).
          before-script-linux: export ORT_CXX_STDLIB=
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow numpy dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # OpenVINO wheel (x86_64 only). There is no PyPI openvino wheel for
  # linux-aarch64, so the ARM64 OV libs have no pip source; the ORT wheel
  # remains the ARM story (an official-archive route is a possible follow-up).
  # Built with --no-default-features so ONNX Runtime is not compiled in: this
  # wheel ships OpenVINO only. The OV DLLs/.so's are vendored INTO the wheel by
  # build.rs, and it ships under the faster-paddle-openvino distribution name
  # so both wheels coexist as release assets.
  linux-ov:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Host pip packages are for IR conversion + wheel tests only. The wheel
      # BUILD runs inside the manylinux container, so its own OV/libclang come
      # from the container-local pip in before-script-linux below.
      - run: python -m pip install pytest pillow numpy "openvino==${{ env.OV_VERSION }}"
      - name: Rename distribution for the OV wheel
        shell: bash
        run: |
          sed -i.bak 's/^name = "faster-paddle"$/name = "faster-paddle-openvino"/' pyproject.toml
          rm -f pyproject.toml.bak
          grep '^name = ' pyproject.toml
          if ! grep -q '^name = "faster-paddle-openvino"$' pyproject.toml; then
            echo "::error::pyproject.toml name was not renamed to faster-paddle-openvino; refusing to build a colliding OV wheel"
            exit 1
          fi
      - name: Build OV wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          # --no-default-features: this wheel ships OpenVINO only; the default
          # wheel is the ONNX Runtime one (--auditwheel skip: the OV runtime is
          # vendored manually beside the extension (RPATH $ORIGIN) with
          # plugins.xml + plugin adjacent. Repair would relocate the linked
          # libs into .libs/ (hashed names), stranding plugins.xml/the dlopen'd
          # CPU plugin, which it can't see).
          # pyo3/extension-module must be repeated: maturin ignores pyproject's
          # feature list when the CLI passes --features.
          args: --release --locked --no-default-features --features openvino-backend,pyo3/extension-module --auditwheel skip --out dist
          sccache: "true"
          manylinux: "2_34"
          before-script-linux: |
            # The manylinux container's default `pip`/`python` predates
            # openvino>=2026 (PyPI needs >=3.10), so use the container's
            # cp311 interpreter explicitly (matches the runner's 3.11).
            PYBIN=/opt/python/cp311-cp311/bin/python
            if [ ! -x "$PYBIN" ]; then PYBIN=$(ls -d /opt/python/cp311*/bin/python 2>/dev/null | head -n 1); fi
            "$PYBIN" -m pip install "openvino==${{ env.OV_VERSION }}" libclang
            export OV_LIB_DIR=$("$PYBIN" -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'openvino', 'libs'))")
            export LIBCLANG_PATH=$("$PYBIN" -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'clang', 'native'))")
            ls "$OV_LIB_DIR" "$LIBCLANG_PATH"
            # openvino-sys links `libopenvino.so` / `libopenvino_c.so` by exact
            # name, but the pip wheel ships only versioned files
            # (`libopenvino.so.2641`); symlink them so the finder resolves.
            # SONAMEs stay versioned, so the vendored versioned libs still
            # satisfy the runtime loader via rpath ($ORIGIN).
            ln -sf "$(ls "$OV_LIB_DIR"/libopenvino.so.* | head -n 1)" "$OV_LIB_DIR/libopenvino.so"
            ln -sf "$(ls "$OV_LIB_DIR"/libopenvino_c.so.* | head -n 1)" "$OV_LIB_DIR/libopenvino_c.so"
            ls -la "$OV_LIB_DIR"/libopenvino*.so* "$OV_LIB_DIR"/libopenvino_c*.so*
            export LD_LIBRARY_PATH="$OV_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      # Convert tiny+small to IR on the fly and run the FULL suite with OV as
      # the default (and only) backend; tests that need ONNX Runtime internals
      # skip themselves via faster_paddle.__backends__. Medium is covered by
      # the local A/B, not CI (conversion cost).
      - name: Test installed OV wheel (OpenVINO only)
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
          OV_IR_DIR: ${{ github.workspace }}/models
          # IR is converted into the checkout's models/ (not a temp dir): the
          # shared suite passes model_dir=models, which now beats OV_IR_DIR, and
          # the ORT resolver ignores the .xml/.bin files sitting beside .onnx.
        run: |
          python scripts/convert_ir.py "$OV_IR_DIR" tiny small
          python -m pip install dist/*.whl
          echo "--- vendored runtime proof (fatal if incomplete) ---"
          python scripts/check_wheel_runtime.py dist/*.whl
          python -c "import faster_paddle; assert faster_paddle.__backends__ == ['ov'], faster_paddle.__backends__; print('backends OK:', faster_paddle.__backends__, faster_paddle.__runtime_build__)"
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-ov-linux-x86_64
          path: dist

  windows:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow numpy dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # Windows OpenVINO wheel. Native deps come from pinned pip packages
  # (openvino for the runtime, libclang for bindgen); the wheel itself stays
  # self-contained via build.rs vendoring. Ships as faster-paddle-openvino.
  windows-ov:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target }}
      - run: python -m pip install pytest pillow numpy "openvino==${{ env.OV_VERSION }}" libclang
      - name: Locate native deps
        shell: bash
        run: |
          OV_DIR=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'openvino', 'libs'))")
          CLANG_DIR=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'clang', 'native'))")
          echo "OV_LIB_DIR=$OV_DIR" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$CLANG_DIR" >> "$GITHUB_ENV"
          # openvino-sys locates openvino.lib / openvino_c.lib via PATH on
          # Windows; build.rs vendoring uses OV_LIB_DIR. Save the PATH without
          # OV_DIR so the test step can restore it: the wheel must prove it is
          # self-contained, and pip's OV DLLs on PATH would mask a missing
          # vendored DLL.
          echo "PATH_BEFORE_OV=$PATH" >> "$GITHUB_ENV"
          echo "$OV_DIR" >> "$GITHUB_PATH"
          ls "$OV_DIR"
      - name: Rename distribution for the OV wheel
        shell: bash
        run: |
          sed -i.bak 's/^name = "faster-paddle"$/name = "faster-paddle-openvino"/' pyproject.toml
          rm -f pyproject.toml.bak
          grep '^name = ' pyproject.toml
          if ! grep -q '^name = "faster-paddle-openvino"$' pyproject.toml; then
            echo "::error::pyproject.toml name was not renamed to faster-paddle-openvino; refusing to build a colliding OV wheel"
            exit 1
          fi
      - name: Build OV wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --no-default-features --features openvino-backend,pyo3/extension-module --out dist
          sccache: "true"
      - name: Test installed OV wheel (OpenVINO only)
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
          OV_IR_DIR: ${{ github.workspace }}/models
          # IR is converted into the checkout's models/ (not a temp dir): the
          # shared suite passes model_dir=models, which now beats OV_IR_DIR, and
          # the ORT resolver ignores the .xml/.bin files sitting beside .onnx.
        run: |
          # Drop the build-time OV_DIR PATH entry: the wheel vendors its own
          # runtime, so the tests must pass without pip's OpenVINO DLLs.
          export PATH="${PATH_BEFORE_OV:-$PATH}"
          python scripts/convert_ir.py "$OV_IR_DIR" tiny small
          python -m pip install dist/*.whl
          echo "--- vendored runtime proof (fatal if incomplete) ---"
          python scripts/check_wheel_runtime.py dist/*.whl
          python -c "import faster_paddle; assert faster_paddle.__backends__ == ['ov'], faster_paddle.__backends__; print('backends OK:', faster_paddle.__backends__, faster_paddle.__runtime_build__)"
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-ov-windows-${{ matrix.target }}
          path: dist

  macos:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14      # apple silicon
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      # The wheels built above are code-only (no bundled weights); point the
      # suite at the checkout's models/ so wheel tests stay offline and never
      # depend on release assets.
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m pip install pytest pillow numpy dist/*.whl
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # macOS (Apple Silicon) OpenVINO wheel. CPU-only on macOS, same shape as the
  # other OV jobs: pinned pip runtime, vendored dylibs, faster-paddle-openvino
  # distribution name. Linux/macOS .so/.dylib names in build.rs are verified
  # against the pinned pip layout; this job is the release gate for them.
  macos-ov:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: macos-14      # apple silicon
    timeout-minutes: 45
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pillow numpy "openvino==${{ env.OV_VERSION }}" libclang
      - name: Locate native deps
        shell: bash
        run: |
          OV_DIR=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'openvino', 'libs'))")
          CLANG_DIR=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'clang', 'native'))")
          echo "OV_LIB_DIR=$OV_DIR" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$CLANG_DIR" >> "$GITHUB_ENV"
          # openvino-sys links `libopenvino.dylib` / `libopenvino_c.dylib` by
          # exact name, but the pip wheel ships only versioned files
          # (`libopenvino.2641.dylib`); symlink them so the finder (which
          # probes DYLD_LIBRARY_PATH on macOS) resolves. Install names stay
          # versioned, so the vendored versioned dylibs still satisfy the
          # loader via @loader_path rpath.
          ln -sf "$(ls "$OV_DIR"/libopenvino.[0-9]*.dylib | head -n 1)" "$OV_DIR/libopenvino.dylib"
          ln -sf "$(ls "$OV_DIR"/libopenvino_c.[0-9]*.dylib | head -n 1)" "$OV_DIR/libopenvino_c.dylib"
          echo "DYLD_LIBRARY_PATH=$OV_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          ls -la "$OV_DIR"
      - name: Rename distribution for the OV wheel
        shell: bash
        run: |
          sed -i.bak 's/^name = "faster-paddle"$/name = "faster-paddle-openvino"/' pyproject.toml
          rm -f pyproject.toml.bak
          grep '^name = ' pyproject.toml
          if ! grep -q '^name = "faster-paddle-openvino"$' pyproject.toml; then
            echo "::error::pyproject.toml name was not renamed to faster-paddle-openvino; refusing to build a colliding OV wheel"
            exit 1
          fi
      - name: Build OV wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --no-default-features --features openvino-backend,pyo3/extension-module --out dist
          sccache: "true"
      - name: Test installed OV wheel (OpenVINO only)
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FASTER_PADDLE_MODEL_DIR: ${{ github.workspace }}/models
          OV_IR_DIR: ${{ github.workspace }}/models
          # IR is converted into the checkout's models/ (not a temp dir): the
          # shared suite passes model_dir=models, which now beats OV_IR_DIR, and
          # the ORT resolver ignores the .xml/.bin files sitting beside .onnx.
        run: |
          # GITHUB_ENV carried DYLD_LIBRARY_PATH here from "Locate native
          # deps" (needed only by the build's openvino-finder probe). Drop it:
          # the wheel vendors its own runtime, and dropping it rules out
          # host-lib bleed if a vendored rpath ever regresses.
          unset DYLD_LIBRARY_PATH
          python scripts/convert_ir.py "$OV_IR_DIR" tiny small
          python -m pip install dist/*.whl
          echo "--- vendored runtime proof (fatal if incomplete) ---"
          python scripts/check_wheel_runtime.py dist/*.whl
          python -c "import faster_paddle; assert faster_paddle.__backends__ == ['ov'], faster_paddle.__backends__; print('backends OK:', faster_paddle.__backends__, faster_paddle.__runtime_build__)"
          if ! python -m pytest tests -q > wheel-tests.log 2>&1; then
            cat wheel-tests.log
            python -c "from pathlib import Path; print('::error::' + Path('wheel-tests.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
            exit 1
          fi
          cat wheel-tests.log
      # A native segfault leaves almost no signal in the pytest log. Dump the
      # wheel layout, the vendored dylibs' rpaths, and the macOS crash report
      # (which holds the native crashing frame) so the next failure is actionable.
      - name: Dump macOS crash diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          echo "--- wheel contents ---"
          unzip -l dist/*.whl | head -n 40 || true
          echo "--- installed package ---"
          PURE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          ls -la "$PURE" | grep -i -E "faster|openvino" || true
          PKG=$(ls -d "$PURE"/faster_paddle* 2>/dev/null | head -n 1)
          echo "PKG=$PKG"
          if [ -n "$PKG" ] && [ -d "$PKG" ]; then
            ls -la "$PKG"
            for f in "$PKG"/*.dylib "$PKG"/*.so; do
              [ -e "$f" ] || continue
              echo "== $f"
              otool -l "$f" | grep -A3 LC_RPATH || echo "  (no LC_RPATH)"
              otool -L "$f" || true
            done
          fi
          echo "--- crash reports ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 10 || echo "(no DiagnosticReports)"
          latest=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 1)
          if [ -n "$latest" ]; then echo "== $latest (first 600 lines)"; head -n 600 "$latest"; fi
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-ov-macos-${{ matrix.target }}
          path: dist

  sdist:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Tag-only: proves the pinned model-weights release (see MODELS_TAG in
  # src/lib.rs, published by the Models workflow) serves the exact asset names
  # the runtime downloads. No checkout and no local weights: constructing an
  # engine must fetch both files and report `downloaded`.
  download-check:
    name: Check on-demand model download
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, linux]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install dist/*.whl
      - name: Construct an engine with no local weights (forces download)
        shell: bash
        env:
          OCR_THREADS: "2"
        run: |
          python -c "
          from faster_paddle import OcrEngine
          eng = OcrEngine(model_size='tiny', threads=2)
          cfg = eng.config
          assert (cfg['det_source'], cfg['rec_source']) == ('downloaded', 'downloaded'), cfg
          print('download OK:', cfg['det_model_size'], cfg['det_source'], cfg['rec_source'])
          "

  # Tag-only: proves the pinned model-weights release serves the exact IR asset
  # names the OV backend downloads (mirrors download-check). No checkout, no
  # local weights: constructing backend="ov" must pull all four IR files.
  ov-download-check:
    name: Check on-demand IR download (OV wheel)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, linux-ov]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheels-ov-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pillow dist/*.whl
      - name: Construct an OV engine with no local weights (forces IR download)
        shell: bash
        env:
          OCR_THREADS: "2"
        run: |
          python -c "
          import faster_paddle
          assert 'ort' not in faster_paddle.__backends__, faster_paddle.__backends__
          from PIL import Image, ImageDraw
          im = Image.new('RGB', (800, 200), 'white')
          ImageDraw.Draw(im).text((20, 60), 'Hello OV 123', fill='black')
          im.save('/tmp/ov-smoke.png')
          from faster_paddle import OcrEngine
          eng = OcrEngine(model_size='tiny', backend='ov', threads=2)
          cfg = eng.config
          assert (cfg['det_source'], cfg['rec_source']) == ('downloaded', 'downloaded'), cfg
          r = eng.ocr(open('/tmp/ov-smoke.png', 'rb').read())
          print('ov download OK:', cfg['det_model_size'], cfg['det_source'], cfg['rec_source'], '| boxes:', len(r['bounds']))
          "

  # Tag-only: attach the prebuilt wheels (+ sdist) to the GitHub release so
  # consumers can install without Rust/MSVC, e.g.
  #   uv pip install https://github.com/phruut/faster-paddle/releases/download/v1.2.2/<wheel-file>
  # Gated on both download checks so the wheels only publish once they and the
  # pinned model-weights release are validated. Version releases carry wheels
  # only; weights live in the separate Models release.
  release:
    name: Attach wheels to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, tests, linux, windows, macos, sdist, download-check, linux-ov, windows-ov, macos-ov, ov-download-check]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
